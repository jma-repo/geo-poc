# What the free collectors look for. Edit freely; keep volumes modest and respect each site's limits.

subreddits: [Calgary, Alberta, PersonalFinanceCanada, BuyCanadian, CampingandHiking, dogs, HomeImprovement, BuyItForLife]

# Pages of 100 read per subreddit and kind (posts, comments), newest first
reddit_max_pages: 30

# Phrases that signal someone wants to buy or solve something (matched in Reddit posts and comments)
reddit_queries:
  - recommend
  - "where can I buy"
  - "looking for"
  - "wish there was"

# Topic queries for Hacker News, Stack Exchange and YouTube
queries:
  - hail damage car cover
  - winter dog boots salt
  - ice cleats recommendation
  - bear spray holster

stackexchange_sites: [diy, outdoors, pets, mechanics]
# Short keywords: these sites are low-volume, so multi-word phrases rarely match
stackexchange_queries: [hail, snow, ice, winter, boots, salt, frozen]

# Google autocomplete expands each seed with a-z to show what people type next
autocomplete_seeds:
  - hail cover for
  - best winter boots for
  - calgary where to buy

# Lookback (days) for low-volume Q&A sources; their questions stay relevant for months
stackexchange_days: 365
hn_days: 90

# Sources for the daily run. hn is left out: it returned almost nothing relevant to consumer products.
daily_sources: [arctic_shift, stackexchange, autocomplete]
