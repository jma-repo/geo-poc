[project]
name = "geo"
version = "0.1.0"
description = "Generative engine optimization toolkit: publish AI-readable product data and measure AI visibility."
requires-python = ">=3.10"
dependencies = [
  "anthropic>=2.8,<3",
  "httpx>=0.28",
  "pydantic>=2.7",
  "pyyaml>=6",
]

[project.optional-dependencies]
test = ["pytest>=8", "respx>=0.21"]

[project.scripts]
geo = "geo.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
